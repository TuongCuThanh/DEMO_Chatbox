<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>AutoShop - Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #eef2f7; padding: 24px; }
    h1 { color: #1e293b; }
    table { border-collapse: collapse; background: #fff; width: 100%; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    th, td { border: 1px solid #e2e8f0; padding: 8px 10px; font-size: 14px; text-align: left; }
    th { background: #2563eb; color: #fff; }
    input { width: 130px; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { background: #16a34a; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
    button.ok { background: #64748b; }
    .msg { font-size: 13px; color: #16a34a; margin: 8px 0; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>🛠️ Admin: đổi giá / tồn kho (cập nhật realtime vào DB)</h1>
  <p>Sau khi Lưu → mở <a href="/">trang chat</a> và hỏi lại: bot sẽ đọc giá mới nhất từ database.
     Xem thêm <a href="/customers.html">👥 Khách hàng (leads)</a>.</p>
  <div class="msg" id="msg"></div>
  <table id="tbl">
    <thead>
      <tr><th>ID</th><th>Xe</th><th>Giá (₫)</th><th>Tồn kho</th><th>Khuyến mãi</th><th>Cập nhật lúc</th><th></th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <script>
    const msg = document.getElementById("msg");
    async function load() {
      const cars = await (await fetch("/api/cars")).json();
      const tb = document.querySelector("#tbl tbody");
      tb.innerHTML = "";
      for (const c of cars) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${c.id}</td>
          <td>${c.brand} ${c.model} ${c.version || ""} (${c.sku})</td>
          <td><input id="p${c.id}" value="${c.price}"></td>
          <td><input id="s${c.id}" value="${c.stock}" style="width:70px"></td>
          <td><input id="pr${c.id}" value="${c.promotion || ""}" style="width:220px"></td>
          <td>${c.updated_at}</td>
          <td><button data-id="${c.id}">Lưu</button></td>`;
        tb.appendChild(tr);
      }
      tb.querySelectorAll("button").forEach(b => b.onclick = () => save(b.dataset.id, b));
    }
    async function save(id, btn) {
      const body = {
        price: Number(document.getElementById("p" + id).value),
        stock: Number(document.getElementById("s" + id).value),
        promotion: document.getElementById("pr" + id).value || null,
      };
      const res = await fetch("/api/cars/" + id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (res.ok) {
        msg.textContent = "✅ Đã lưu xe #" + id + " lúc " + new Date().toLocaleTimeString();
        btn.textContent = "Đã lưu"; btn.classList.add("ok");
        setTimeout(() => { btn.textContent = "Lưu"; btn.classList.remove("ok"); }, 2000);
      } else {
        msg.textContent = "❌ Lỗi: " + (await res.text());
      }
    }
    load();
  </script>
</body>
</html>
